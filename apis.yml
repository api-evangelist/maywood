aid: maywood
name: Maywood
description: >-
  Maywood is a Y Combinator (W26) artificial-intelligence startup building a
  finance-compliant, proactive AI platform that automates deal execution for
  investment banks. The product runs continuously across a banker's network,
  pipeline, and active M&A processes, generating client-ready CIMs, pitch decks,
  and financial models, drafting outreach in the banker's voice, and managing
  due-diligence workflows through a connected data layer that updates
  automatically. Maywood is built to FINRA and SEC requirements: autonomous
  within scope, human-approved at every external boundary, and fully
  reconstructable in between. Founded in 2026 and based in New York City, it is
  an early-stage SaaS company with no public developer API at this time; this
  profile tracks its public web, security, and trust surfaces so the network can
  detect an API program when one appears.
